<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário descritivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style2.css">
</head>
<body>
<div class="container" id="entrada">
    <label for="descricao">Descrição</label><br/>
    <input type="text" id="descricao" placeholder="Digite uma descrição"/><br/>
    <label for="quantidade">Quantidade</label><br/>
    <input type="number" id="quantidade" placeholder="Quantidade"/><br/>
    <input type="submit" value="Mostrar" onclick="adicionarElemento()" class="btn btn-primary">
    <div id="resultado"></div>
</div>
<script src="utils.js"></script>
</body>
</html>
