<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Analise de Dados</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <form>
        <label for="valor">Valor</label><br/>
        <input type="number" id="valor" required><br/>
        <label for="quantidade">Quantidade</label><br/>
        <input type="number" id="quantidade" required><br/>
        <input type="button" class="btn btn-primary" id="btn-adicionar" value="Adicionar"/>
        <button type="button" class="btn btn-warning" onclick="limparCampos()">Limpar</button>
        <input type="button" class="btn btn-success" onclick="calcularValores()" value="Calcular"/>
    </form>

    <div id="resultado"></div>

    <div class="container">
        <table class="table table-striped table-hover">
            <thead>
            <tr>
                <th scope="col">Valor</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Percentual</th>
                <th scope="col">Ação</th>
            </tr>
            </thead>
            <tbody id="tabela">
            </tbody>
        </table>
    </div>

    <canvas id="myChart" width="400" height="400"></canvas>
    <script src="script.js"></script>
</div>
</body>
</html>
