<!DOCTYPE html>
<html lang="pt-br">
<head>

    <div class="container">
        <table class="table table-striped table-hover table-bordered" id="tbl-resultado" >
            <thead>
            <tr>
                <th scope="col">Valor</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Produto</th>
                <th scope="col">Percentual</th>
                <th scope="col">Ângulo</th>

            </thead>
            <tbody id="tabela">
            </tbody>
        </table>
    </div>

    <canvas id="graficoPizza" width="400" height="400"></canvas>

</div>
